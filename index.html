<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>BookStore 📚</h1>
        <p>Discover, Search and Manage Your Favourite Books</p>
    </header>
    <div class="inputs">
        <input type="search" name="search" id="search" Placeholder="Search book by title or author....">
        <button onclick="searchBooks()">Search Books</button>
        <button onclick="showBooks()">Show All</button>
    </div>
    <h2 style="text-align: center; padding: 30px;">Book List</h2>
      <div class="books-list" id="book-list"></div>
    <p id="message"></p>
    <div class="add-book">
        <h2>Add Book</h2>
        <form id="form">
            <input type="text" id="book-title" placeholder="Book Title" required>
            <input type="text" id="book-author" placeholder="Author Name" required>
            <input type="text" id="img-url" placeholder="Book Image URL (optional)">
            <button type="submit" onclick="addBook()">Add Book</button>
        </form>
    </div>
    <footer>&copy; BookStore all rights reserved</footer>
    <script src="script.js"></script>
</body>
</html>
